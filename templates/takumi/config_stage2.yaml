# Stage 2 ablation 用 config.
# 主目的サブ問い「genome inspection (本人の認知計測) が伝承を effective にするか」を
# 測るため、Stage 1 の同じ components を Stage 2 で走らせて Δ を取る.
#
# Stage 1 vs Stage 2 比較対象:
#   A1_S2       (vs A1     run_a1_full)
#   A_human_S2  (vs A_human  run_a_human)
#   A_AIS_S2    (Stage 1 で best だった idea 1-2 個)

experiment:
  stage: 2
  run_label: "stage2_ablation"

env:
  backend: jax
  training_max_steps: 3000
  test_max_steps: 3000

inner_loop:
  K: 10
  eval_episodes: 100
  seed: 0
  subsample_interval: 10
  max_steps_per_episode: 3000

models:
  articulator: claude-opus-4-7        # Stage 2 では genome 解釈が要るので Opus 維持
  mutator: claude-haiku-4-5           # Mutator 側は Stage 1/2 で同じ. main config と同期.

articulator_params:
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3
  trajectory_episodes: 1

mutator_params:
  temperature: 0.5
  max_tokens: 3000              # main config と同期 (truncation 防止)
  max_retries: 3
  max_mutations_per_cycle: 6

stage_label:
  novice_below: -2.0
  expert_above: 2.0
  window: 3

visualization:
  enabled: true
  per_cycle_topology: true
  include_init_topology: true
  end_of_loop_curve: true
  gameplay_gif: true
  gif_max_steps: 1000
  gif_n_trials: 5
  gif_seed: 0
  topology_dpi: 120
  curve_dpi: 140

budget:
  warning_threshold_usd: 70.0
  hard_limit_usd: 95.0

data:
  expert_trajectory: data/expert_trajectory.yaml
  expert_genome: data/expert_genome.yaml
