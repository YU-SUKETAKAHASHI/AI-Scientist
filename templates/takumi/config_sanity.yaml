# S1 micro sanity (K=2, eval=5).
# 目的: API key + model alias + 1 cycle articulator + 2 cycle mutator が
# 実 API で動くかだけを最小コストで確認する.
# 想定 cost: ~$0.05–0.15.

experiment:
  stage: 1
  run_label: "s1_sanity"

env:
  backend: jax
  training_max_steps: 3000
  test_max_steps: 3000

inner_loop:
  K: 2                          # micro
  eval_episodes: 5              # micro
  seed: 0
  subsample_interval: 10
  max_steps_per_episode: 3000

models:
  articulator: claude-opus-4-7
  mutator: claude-sonnet-4-6

articulator_params:
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3
  trajectory_episodes: 1

mutator_params:
  temperature: 0.5
  max_tokens: 1500
  max_retries: 3
  max_mutations_per_cycle: 6

stage_label:
  novice_below: -2.0
  expert_above: 2.0
  window: 3

visualization:
  enabled: true
  per_cycle_topology: true
  include_init_topology: true
  end_of_loop_curve: true
  gameplay_gif: true
  gif_max_steps: 300            # sanity は短く
  gif_n_trials: 3               # sanity は少なく
  gif_seed: 0
  topology_dpi: 120
  curve_dpi: 140

budget:
  warning_threshold_usd: 70.0
  hard_limit_usd: 95.0

data:
  expert_trajectory: data/expert_trajectory.yaml
  expert_genome: data/expert_genome.yaml
